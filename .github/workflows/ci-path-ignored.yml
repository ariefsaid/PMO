name: CI

# ⚑ Deadlock breaker — the counterpart to ci.yml's `paths-ignore`.
#
# `main` requires the `verify` and `integration` status checks (branch protection). Those contexts
# are NOT path-aware: protection demands them on EVERY PR. But `ci.yml` path-ignores docs/markdown
# changes, so a PR touching only those paths never starts the workflow, the required contexts never
# report, and the PR is blocked FOREVER with no way to satisfy it. Found 2026-07-25 while shipping
# v0.8.0; it had not bitten only because promotes always carry code.
#
# This workflow uses the INVERSE filter (`paths`, the same list ci.yml ignores) and publishes the
# same two check names. Exactly one of the two workflows runs for any given PR, so protection is
# always satisfiable and the checks never race.
#
# ⚠ These jobs deliberately run NO tests. They assert a narrower claim — "this change cannot affect
# the test outcome, because it touches only paths the test pipeline ignores." If you ever add a path
# here that DOES affect behaviour, you are green-washing: fix the path lists, not this file.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'review/**'
      - '.claude/**'
      - '.codex/**'
      - '**/*.md'
      - '.gitignore'
      - 'AGENTS.md'
      - 'LICENSE'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: No-op (documentation-only change)
        run: |
          echo "This PR touches only paths that ci.yml path-ignores (docs/markdown/agent config)."
          echo "No application code, tests, migrations or workflows changed, so 'verify' cannot be"
          echo "affected. Reporting success so branch protection is satisfiable — NOT because tests ran."

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: No-op (documentation-only change)
        run: |
          echo "Same rationale as 'verify' above: nothing in this diff can change the integration"
          echo "outcome. If a code path ever reaches this workflow, the paths filters are wrong."
