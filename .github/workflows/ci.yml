name: CI

on:
  push:
    # PUSH CI on `main` and `dev`. `main`: a post-merge `verify` smoke of what actually landed —
    # its protection is not strict (a PR can merge on a stale base) and Dependabot / release-please
    # merge there directly, so this is the only re-test of the merged result. `dev` (#1584): PRs to
    # `dev` run only the tests their diff can affect (see `scope`), so the push to `dev` is the
    # FULL suite — unit, verify, pgTAP — and anything a PR's selection missed is caught here, one
    # run after the merge. Feature branches are PR-gated → no push trigger there.
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'review/**'
      - '.claude/**'
      - '.codex/**'
      - '**/*.md'
      - '.gitignore'
      - 'AGENTS.md'
      - 'LICENSE'
  # ⚑ NO paths-ignore on pull_request — deliberately. `main` requires the `verify` and
  # `integration` checks, and required contexts are NOT path-aware: protection demands them on
  # EVERY PR. With a paths-ignore here, a docs-only PR never started the workflow, the contexts
  # never reported, and the PR was UNMERGEABLE FOREVER with no way to satisfy it.
  #
  # The obvious fix — a second workflow with the inverse `paths` filter publishing the same check
  # names — is WRONG: GitHub path filters are OR-based over changed files, so a MIXED PR (docs +
  # code) triggers BOTH workflows, yielding two `verify` and two `integration` runs. A passing stub
  # alongside a failing real job is exactly the green-washing these gates exist to prevent.
  #
  # So one workflow owns these names and always runs on a PR. The cost is that a docs-only PR runs
  # the full suite; that is rare (docs go direct to `dev` per CLAUDE.md) and correctness beats CI
  # minutes.
  pull_request:
  # Dispatched only via scripts/ci-e2e.sh, for a PR to `dev` whose PR run already did `verify` +
  # `pgtap` — so a dispatch runs the browser shards, `integration-lanes` and the `integration`
  # aggregate, skipping the pgTAP step unless `run_pgtap` (ci-e2e.sh sets it when the branch has
  # no PR, i.e. nothing ran pgTAP on it yet).
  workflow_dispatch:
    inputs:
      run_pgtap:
        description: Also run pgTAP (set when no PR's pgtap job covers this branch)
        type: boolean
        default: false

# Least privilege: the workflow only reads the repo (checkout + diff); it never writes
# contents, issues, PRs, or packages.
permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR —
# avoids paying for superseded runs during iterative pushes. On a push to `dev` this is safe
# (#1584): every push runs the FULL suite on a tree that contains all earlier commits, so a later
# run covers whatever a cancelled earlier one would have tested; a failure in the later run still
# names the merge it ran on (the "Name the merged change" step in `verify`).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pmo-portal

# ─── JOB GRAPH (#2161) ──────────────────────────────────────────────────────────
# The required `verify` context aggregates the verify lanes; `integration` aggregates the
# independent browser and integration lanes on release PRs / dispatches:
#
#   scope ─┬─ unit ×N (blob report + coverage each) ─→ coverage (merge + ≥80% gate) ─┐
#          ├─ checks (guards · typecheck · lint · audits · build · script tests) ─────┤
#          └─ deno (edge-fn tests + M365; conditional on scope.deno) ─────────────────┴→ verify
#   scope ────────────────────────────────────────→ integration-lanes ──────┐
#   browser-chromium ×3 ─────────────────────────────────────────────────────┴→ integration-full ─┐
#   scope ─────────────────────────────────────────────────────────────────────────────────────────┴→ integration
# A validated release-please version-only PR runs the version check and both required aggregates,
# while skipping unit, Deno, browser and integration lanes.
#   pgtap runs separately for PR→dev and push→dev.
#
# `verify` runs no tests: it fails closed unless every scheduled verify-stage job succeeded, or the
# release-please scope validation passed and the heavy jobs were skipped. That split is
# what lets the ~8-min `checks`, ~9-min `deno` and ~7-min `unit` lanes overlap instead of queueing
# behind each other (a full dev push was ~34 min end-to-end; #2161 targets ≤16). The NAME is
# preserved on purpose: `main`'s branch protection requires exactly `verify` + `integration`, and
# protection was not touched by this change. `!cancelled()` on `verify` is load-bearing — a failed
# shard must FAIL the required check, never skip it (a skipped required check counts as passing).
#
# ─── CI TIERING (resource-lean) ─────────────────────────────────────────────────
# PR → dev    → `scope` picks what the diff can affect (scripts/ci-test-scope.mjs): the unit
#               job runs only the AFFECTED tests (or the full suite when the diff touches
#               anything the module graph can't see), `pgtap` only when supabase/** or its
#               scripts change, the `deno` job only when edge functions change.
#               Typecheck · lint · guards · build always run. No browser. Fast lane.
# push dev    → everything, full: unit (4 shards) · checks · coverage · verify · pgtap (#1584).
# PR → main   → (everything full) `verify` + required `integration` aggregate; a validated
#               release-please version-only diff keeps both required contexts and skips test/e2e
#               lanes. Every other PR runs browser shards and `integration-lanes` (Supabase + pgTAP
#               + served smoke + consent + serial e2e), then `integration` checks all evidence.
# push main   → `verify` smoke only (pgtap/integration skipped — see their `if`); unit is full.
# dispatch    → browser shards + `integration-lanes` + `integration` aggregate, pgTAP skipped
#               (scripts/ci-e2e.sh; the PR already ran `verify` + `pgtap`).
# Feature branches have no push CI (PR-gated) → no duplicate `verify` runs.
# Integration trims: Playwright browsers cached + Supabase starts without the
# CI-unused containers (studio/realtime/vector). `pgtap` uses the same trim.
# main→production → no CI; main is already pre-gated by the PR that merged it.
# ───────────────────────────────────────────────────────────────────────────────
jobs:
  # What can this change affect? (#1584, scripts/ci-test-scope.mjs, self-tested in `checks`.)
  # Only a PR to `dev` is narrowed; a push (main, dev), a PR to `main` and any other base run
  # everything except the validated release-please version-only path. Narrowed = `unit: affected`
  # (module-graph selection) unless the diff touches
  # something the graph can't see, `pgtap` only for supabase/** and its scripts, `deno` only for
  # edge functions (and the pmo-portal files they import). On the full path, lint, typecheck, guards
  # and build always run. The release-please path skips those jobs after version validation.
  scope:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit_matrix: ${{ steps.scope.outputs.unit_matrix }}
      unit: ${{ steps.scope.outputs.unit }}
      pgtap: ${{ steps.scope.outputs.pgtap }}
      deno: ${{ steps.scope.outputs.deno }}
      release_light: ${{ steps.scope.outputs.release_light }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: scope
        # Event/ref values arrive via env, never interpolated into the shell.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ]; then
            if git fetch --no-tags origin "$BASE_REF"; then
              json=$(node scripts/ci-test-scope.mjs --release-please --target-base "$BASE_REF" --head-branch "$HEAD_BRANCH" --base "origin/$BASE_REF")
            else
              json='{"unit":"full","pgtap":true,"deno":true,"releaseLight":false,"reason":"main base unavailable; full checks required"}'
            fi
            base_sha=
          elif [ "$EVENT" = pull_request ] && [ "$BASE_REF" = dev ]; then
            git fetch --no-tags origin "$BASE_REF"
            json=$(node scripts/ci-test-scope.mjs --base "origin/$BASE_REF")
            base_sha=$(git merge-base "origin/$BASE_REF" HEAD)
          else
            json='{"unit":"full","pgtap":true,"deno":true,"releaseLight":false,"reason":"not a PR to dev or validated release-please PR: everything runs"}'
            base_sha=
          fi
          echo "$json"
          unit=$(jq -r .unit <<<"$json")
          release_light=$(jq -r '.releaseLight // false' <<<"$json")
          # The shard COUNT comes from `strategy.job-total` in the run step (4 in full mode, 1 in
          # affected mode), so it is declared here once and never repeated as a magic number.
          if [ "$unit" = full ]; then
            matrix='{"include":[{"shard":1,"mode":"full"},{"shard":2,"mode":"full"},{"shard":3,"mode":"full"},{"shard":4,"mode":"full"}]}'
          else
            matrix='{"include":[{"shard":1,"mode":"affected"}]}'
          fi
          {
            echo "unit=$unit"
            echo "unit_matrix=$matrix"
            echo "pgtap=$(jq -r .pgtap <<<"$json")"
            echo "deno=$(jq -r .deno <<<"$json")"
            echo "release_light=$release_light"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"
          echo "### Test scope" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$json\`" >> "$GITHUB_STEP_SUMMARY"

  # The Vitest suite. Full mode: split across 4 parallel runners (#2161 — 2 shards measured ~10 and
  # ~16 min, which is the whole critical path once `checks` runs alongside; 4 shards land ~7 min.
  # Runner-minutes are cheaper than the wall clock here, and the owner's v0.23.0 throughput override
  # already allows parallel dispatches). Affected mode (PR to dev, see `scope`): ONE runner, the
  # tests the module graph selects from the diff PLUS every test that reads repo files with fs (the
  # graph can't see those reads) — unchanged. Either way each runner writes a blob report with its
  # coverage; the `coverage` job merges them (a single blob merges fine), so the required `verify`
  # check still owns every selected test and the changed-lines coverage gate.
  unit:
    needs: scope
    if: ${{ github.event_name != 'workflow_dispatch' && needs.scope.outputs.release_light != 'true' }}
    runs-on: ubuntu-latest
    # A hung test must not hold a runner for the 6h default (absorbs #1528). 4-way shards run ~7 min.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.unit_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Affected mode diffs against the PR's merge base, so it needs the history.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pmo-portal/package-lock.json
      - run: npm ci
      - name: Unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }}, + coverage)
        if: matrix.mode == 'full'
        run: npx vitest run --coverage --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=blob
      - name: Select the affected unit tests
        if: matrix.mode == 'affected'
        env:
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: |
          test -n "$BASE_SHA"
          npx vitest list --filesOnly --changed "$BASE_SHA" | sed -E 's/^\[[a-z]+\] //' > /tmp/changed-tests.txt
          node ../scripts/ci-test-scope.mjs --fs-coupled > /tmp/fs-tests.txt
          sort -u /tmp/changed-tests.txt /tmp/fs-tests.txt > /tmp/affected-tests.txt
          echo "$(wc -l < /tmp/changed-tests.txt) via the module graph + $(wc -l < /tmp/fs-tests.txt) that read repo files = $(wc -l < /tmp/affected-tests.txt) test files"
      - name: Unit tests (affected by the diff, + coverage)
        if: matrix.mode == 'affected'
        run: |
          mapfile -t files < /tmp/affected-tests.txt
          npx vitest run --coverage --reporter=default --reporter=blob "${files[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-blob-${{ matrix.mode }}-${{ matrix.shard }}
          path: pmo-portal/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ── `checks` — the STATIC half of the old `verify` (#2161) ────────────────────────────────────
  # Guards · typecheck · lint · supply-chain audits · build · repository script tests. None of it
  # consumes a test report, so it needs only `scope` and now runs IN PARALLEL with `unit` instead of
  # queueing behind it. This job is NOT a required context — the required `verify` aggregate below
  # fails closed on its result, so a red guard still blocks a merge. The edge-function lane (Deno
  # typecheck/boot/tests + the M365 mutation witness) lives in `deno` below: measured at ~9 min on
  # the 2026-11-10 dev push, it was the other half of this job's ~17 min serial runtime.
  checks:
    # PR-only: a workflow_dispatch (scripts/ci-e2e.sh) is for e2e; its PR already ran this.
    # `!cancelled()`: keep reporting when a sibling job failed (see `verify`).
    needs: [scope]
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.scope.outputs.release_light != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (5 s on this repo): repository script tests and guards shell out to git,
          # and a shallow clone has no merge base to compare against. The changed-lines gate that
          # used to need this now lives in `coverage`.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pmo-portal/package-lock.json
      # Install the checked-in Playwright/Vitest CLIs before repository script tests spawn them.
      - name: Install Node dependencies for repository contract tests
        working-directory: pmo-portal
        run: npm ci
      # All repository script tests are CI-owned. The database-backed statements
      # proofs run in pgtap after Supabase starts; every other script test runs here.
      - name: Repository script tests (non-DB)
        working-directory: .
        run: |
          mapfile -t tests < <(find scripts -maxdepth 1 -name '*.test.mjs' ! -name 'financial-statements-publication-race.test.mjs' ! -name 'financial-statements-rollback.test.mjs' ! -name 'financial-statements-nightly-intent-race.test.mjs' -print | sort)
          node --test "${tests[@]}"
      - name: CI integration-order test
        working-directory: .
        run: |
          node --test pmo-portal/e2e/support/AC-S21-005-*.test.mjs
          node scripts/check-e2e-skips.mjs --self-test
          node scripts/check-browser-shard-inventory.mjs --self-test
          node scripts/check-e2e-time-budget.mjs --self-test
          node scripts/check-redirect-targets.mjs --self-test
          node scripts/ci-test-scope.mjs --self-test
          bash scripts/check-e2e-isolation.sh --self-test
          bash scripts/check-nul-bytes.sh --self-test
          bash scripts/ci-e2e.sh --self-test
      # EVERY repo guard (package.json `check:guards` — the same list `npm run verify` runs locally,
      # so the two cannot drift; scripts/ci-integration-order.test.mjs asserts it). Cheap — before
      # typecheck/tests so a guard failure surfaces first.
      - name: Repo guards (check:guards)
        run: npm run check:guards
      - name: Supply-chain audit — production deps (blocking)
        # Gate on vulnerabilities in code that SHIPS to users (the production dependency tree).
        # Build-time devDependencies (vite/esbuild/vitest/etc.) never enter the bundle, so an
        # advisory there must not hard-block unrelated shipping — they are audited non-blocking
        # below for visibility. Real build-tooling remediation (e.g. the Vite major bump that
        # patches esbuild GHSA-gv7w-rqvm-qjhr) is scheduled debt, done deliberately.
        # Same high/critical bar as `npm audit --omit=dev --audit-level=high`, but an advisory can
        # be waived only by an explicit, JUSTIFIED, EXPIRING entry in the script. A new advisory is
        # never waived by default, and an expired waiver fails the build — so "unfixable right now"
        # cannot silently become "nobody ever looked again".
        working-directory: .
        run: node scripts/audit-prod.mjs
      - name: Supply-chain audit — full tree incl. dev tooling (visibility, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:ci
      - name: Build
        run: npm run build
      - name: Entry preload list excludes recharts/markdown/compiler
        run: npx vitest run src/lib/build/entryPreload.test.ts
      - name: Lock wrapper process tests
        working-directory: .
        run: python3 -m unittest discover -s scripts/tests -v

      # A push to `dev` is the full suite that backstops every PR's narrowed run; when it fails, say
      # which merge it ran on (a squash merge's subject ends in the PR number).
      - name: Name the merged change
        if: ${{ failure() && github.event_name == 'push' }}
        working-directory: .
        run: echo "::error title=Full suite failed after a push::$(git log -1 --format=%s)"

  # ── `deno` — the edge-function lane, split out of `checks` (#2161) ────────────────────────────
  # Measured on the 2026-11-10 push to dev: Deno typecheck 41 s + edge-fn unit tests 6 min 21 s + the
  # M365 mutation witness 1 min 34 s ≈ 9 min — as much again as everything else in `checks`. Kept in
  # one job they serialised to ~17 min, which becomes the whole wall clock once `unit` runs
  # alongside; as its own lane it overlaps `checks` and `unit` instead.
  # `scope.deno` (#1584) still decides whether it runs at all: a PR to dev that touches no edge
  # function (and no script this lane uses) skips the job — the same skip the old per-step `if:` did.
  # The release-please light path also skips this job after scope validates the version sources.
  deno:
    needs: [scope]
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.scope.outputs.release_light != 'true' && needs.scope.outputs.deno == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node is pinned here only because the M365 witness below is a node script (node builtins
      # only — this lane never runs `npm ci`).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Restore the Deno binary into the runner tool cache first: setup-deno v2.0.5
      # checks the tool cache (tc.find) BEFORE downloading and skips the release
      # download on a hit — the download 504'd GitHub-side on 2026-11-08/09.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/hostedtoolcache/deno
          key: deno-${{ runner.os }}-${{ runner.arch }}-2.7.11
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Pinned (not `latest`/`vx.x`) for deploy-check determinism — bump deliberately.
          # Bump the cache key above together with this version.
          deno-version: '2.7.11'
      # Gap: supabase/functions/** is outside tsc/ESLint (edge functions are Deno programs, not
      # part of the pmo-portal TS project). Each function has its own deno.json import map/deps.
      # --lock + --frozen: each fn's committed deno.lock is checked against its pinned deno.json
      # deps — a floating/uncommitted dependency bump fails CI instead of silently drifting.
      # Runs the SAME script `npm run verify` runs locally (scripts/deno-typecheck-edge-fns.sh) so the
      # local gate and CI can never disagree about which functions are typechecked — a real
      # adapter-dispatch type break was invisible to every local gate until the script existed. The
      # script DISCOVERS the functions (every dir with a deno.json + index.ts) instead of carrying the
      # hand-kept list this step used to hold, which had already drifted 10 functions behind.
      - name: Deno typecheck — edge function entry points + _shared
        working-directory: .
        run: bash scripts/deno-typecheck-edge-fns.sh
      # Boot smoke — `deno check` is type-only and Vitest resolves module-init order differently than
      # the real runtime, so a circular-import TDZ (or any top-level throw) can pass both yet crash the
      # deployed worker at boot (WORKER_ERROR). This imports each entrypoint's graph (Deno.serve stubbed)
      # and fails on any import-time throw. Regression guard for the 2026-07-04 agent-chat boot crash.
      - name: Deno boot smoke — edge function entry points load without throwing
        working-directory: .
        run: bash scripts/deno-boot-smoke-edge-fns.sh

      # ⚑ RUN THE EDGE-FUNCTION UNIT TESTS. `deno check` is type-only and boot-smoke only proves the
      # module graph loads — NEITHER executes a single assertion. Until this step existed, all ~393
      # edge-fn tests across 44 files were LOCAL-ONLY: every money/mirror oracle built during the P3
      # audit rounds (outbox eligibility, never-adopt, mirror lookup columns, company scoping, the
      # approved-only gate) was invisible to CI, so a regression in any of them merged green.
      #
      # Two invocation traps this step encodes (both cost real debugging time):
      #   • `_shared/` is NOT picked up by `deno test` run from a function directory — it must be
      #     named explicitly, which is why it gets its own line below.
      #   • the `external-*` functions need `--allow-env --allow-net --allow-read`; without them the
      #     runner reports `NotCapable: Requires env access` as a TEST FAILURE, which reads exactly
      #     like a broken assertion but is a missing flag.
      - name: Deno unit tests — edge functions + _shared
        working-directory: .
        run: bash scripts/deno-test-edge-fns.sh

      # The Microsoft folder-write allowlist is the one place PMO writes to Microsoft: break each tagged
      # rule and the tests must go red (scripts/m365-record-folder-write-mutation.mjs restores the sources).
      - name: M365 folder-write mutation witness
        working-directory: .
        run: node scripts/m365-record-folder-write-mutation.mjs

      # A push to `dev` is the full suite that backstops every PR's narrowed run; when it fails, say
      # which merge it ran on (a squash merge's subject ends in the PR number).
      - name: Name the merged change
        if: ${{ failure() && github.event_name == 'push' }}
        working-directory: .
        run: echo "::error title=Full suite failed after a push::$(git log -1 --format=%s)"

  # ── `coverage` — the test-report half of the old `verify` (#2161) ─────────────────────────────
  # Merges the `unit` shards' blob reports and enforces the ≥80% changed-lines gate. It needs only
  # `unit`, NOT `checks`, so it finishes while `checks` is still running; the required `verify` then
  # needs only this job's RESULT, not its steps. A single blob merges fine, so affected mode (one
  # shard) takes exactly the same path.
  coverage:
    needs: [scope, unit]
    # Deliberately no `!cancelled()`: a failed shard leaves no reports to merge, and `verify` fails
    # closed on `needs.unit.result` anyway. Skipping keeps the log honest instead of adding a second,
    # confusing red for the same cause.
    if: ${{ github.event_name != 'workflow_dispatch' && needs.scope.outputs.release_light != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the changed-lines coverage gate can diff against the PR base ref.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pmo-portal/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unit-blob-*
          path: pmo-portal/.vitest-reports/
          merge-multiple: true
      - name: Unit tests (+ coverage) — merge the shard report(s)
        run: npx vitest run --merge-reports --coverage
      - name: Changed-lines coverage gate (≥80%)
        if: github.event_name == 'pull_request'
        working-directory: .
        # BASE_REF is passed via env (not interpolated into the shell) so the
        # untrusted github.base_ref can't be shell-injected. fetch-depth: 0 above
        # already provides full history, so no extra --depth is needed.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node scripts/changed-lines-coverage.mjs \
            --base "origin/$BASE_REF" \
            --coverage pmo-portal/coverage/coverage-final.json \
            --min 80

  # ── REQUIRED CHECK: `main` protection requires exactly `verify` + `integration` ───────────────
  # The aggregate gate (#2161): no test runs here — it fails closed unless every scheduled
  # verify-stage job succeeded, or the version-only scope check passed and heavy jobs were skipped.
  # Keeping this NAME is what preserves branch protection: the WORK moved to `checks` +
  # `coverage`, the required CONTEXT did not. (A rename would mean editing protection, which this
  # change deliberately does not do.)
  # `!cancelled()` is load-bearing: a failed shard must FAIL this check, never skip it — a skipped
  # required check counts as passing, which would let a red unit test merge.
  verify:
    needs: [scope, checks, deno, unit, coverage]
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release-please version check passed
        if: needs.scope.outputs.release_light == 'true'
        run: |
          test "${{ needs.scope.result }}" = success
          test "${{ needs.checks.result }}" = skipped
          test "${{ needs.deno.result }}" = skipped
          test "${{ needs.unit.result }}" = skipped
          test "${{ needs.coverage.result }}" = skipped
      - name: Every verify-stage job passed
        if: needs.scope.outputs.release_light != 'true'
        run: |
          test "${{ needs.scope.result }}" = success
          test "${{ needs.checks.result }}" = success
          test "${{ needs.unit.result }}" = success
          test "${{ needs.coverage.result }}" = success
      # The edge-function lane is only scheduled when `scope.deno` says the diff can affect it
      # (#1584), so its result is asserted under the SAME condition — a skipped-but-required lane
      # would otherwise count as a pass, and an unconditional assertion would fail every PR that
      # legitimately skips it.
      - name: Edge-function lane passed (when it ran)
        if: ${{ needs.scope.outputs.release_light != 'true' && needs.scope.outputs.deno == 'true' }}
        run: test "${{ needs.deno.result }}" = success
      # The checkout exists only for the failure annotation below (`git log` needs a repository);
      # depth 1 is enough for the subject line.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ failure() && github.event_name == 'push' }}
        with:
          fetch-depth: 1
      # A push to `dev` is the full suite that backstops every PR's narrowed run; when a shard or
      # `checks` fails, name the merge the run tested (a squash merge's subject ends in the PR number).
      - name: Name the merged change
        if: ${{ failure() && github.event_name == 'push' }}
        working-directory: .
        run: echo "::error title=Full suite failed after a push::$(git log -1 --format=%s)"

  pgtap:
    # PR→dev fast-lane addition: pgTAP is cheap (no browser, Supabase stack only, seconds not
    # minutes) so it runs here too — RLS/tenancy/SoD regressions get caught before merge to
    # dev, not just at the dev→main promote. The Playwright/e2e/visual portion stays reserved
    # for the `integration` job (PR→main only) below — this job does NOT duplicate it.
    #
    # #1584: on a PR to dev it runs only when `scope.pgtap` (supabase/** or a script this job runs
    # changed); a skipped job counts as passing and `dev` has no required checks. A push to `dev`
    # always runs it (the full-suite backstop). PR→main / push main are unchanged (`integration`).
    needs: scope
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.base_ref == 'dev' && needs.scope.outputs.pgtap == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # supabase CLI must be run from repo root (where supabase/config.toml lives)
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail fast on duplicate migration prefixes — the clear one-liner version of
      # the confusing `supabase db reset`/pgTAP failure a collision causes below.
      # (The other repo guards run once, in `checks` — see check:guards.)
      - name: Migration prefix collision check
        run: bash scripts/check-migration-collisions.sh

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.1
      # Pull every Supabase image (stack, pg_prove) from Docker Hub: GHCR rate-limits
      # them (`toomanyrequests`, even authenticated) and public ECR hits its data limit.
      - name: Use Docker Hub for Supabase images
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"

      # Docker is pre-installed on ubuntu-latest; storage + edge_runtime are disabled in
      # config.toml. Also exclude CI-unused containers to shave the stack-up time:
      # studio (web UI — headless CI), realtime (app has 0 realtime usage), vector (log
      # shipper). Mirrors the `integration` job's stack trim (pgTAP doesn't need
      # storage/inbucket — those are e2e-only concerns).
      - name: Start local Supabase stack
        run: supabase start -x studio,realtime,vector

      - name: Financial statement script tests (local Supabase required)
        env:
          SUPABASE_DB_CONTAINER: supabase_db_pmo-portal
        # Every file here mutates the one local database (owned fixture org + migration down/up or
        # two-session interleaving): run them serially. The nightly-intent race owns AC-NS-004/005's
        # concurrent evidence, so it must gate this DB-owning path rather than a local-only run.
        run: node --test --test-concurrency=1 scripts/financial-statements-publication-race.test.mjs scripts/financial-statements-rollback.test.mjs scripts/financial-statements-nightly-intent-race.test.mjs

      # Applies every migration in order and re-seeds from supabase/seed.sql so tests
      # always start from a clean, known state.
      - name: Reset DB (migrations + seed)
        id: reset_db
        run: supabase db reset --yes

      # #1196: a reset that cannot restart the stack reports only "Error status 502" after
      # "Restarting containers...", which does not say WHICH service was unavailable. This
      # failure-only step records bounded container health/status/exit fields plus status-code-only
      # probes through Kong; it never prints env, credentials, rows, response bodies or container
      # logs. The failed reset step above still decides the job outcome — this step cannot change it.
      - name: Diagnose reset failure (bounded, redacted)
        if: failure() && steps.reset_db.outcome == 'failure'
        continue-on-error: true
        run: node scripts/ci-reset-diagnostics.mjs --out /tmp/ci-reset-diagnostics.md
      - name: Upload reset diagnostics
        if: failure() && steps.reset_db.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reset-diagnostics-pgtap
          path: /tmp/ci-reset-diagnostics.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Project short-name migration round trip
        run: scripts/with-db-lock.sh node scripts/check-project-short-name-reversal.mjs

      # Isolation-probe denominator guard (#612 item 1): the checked-in surface manifest must name
      # every public table / SECURITY DEFINER function / edge function / storage bucket, and must not
      # carry stale entries. Fails the DB lane when a new surface appears without a manifest entry.
      - name: Isolation denominator guard self-test
        run: node scripts/check-isolation-denominator.mjs --self-test
      - name: Isolation denominator guard
        run: node scripts/check-isolation-denominator.mjs

      # pgTAP gate (0001..0060) — RLS, tenancy, SoD proofs.
      - name: pgTAP integration tests
        run: supabase test db

      # AC-CQ-003 (issue #1281): contract-quantities upgrade/reversal round trip. The harness
      # inlines migration 0337 and its rollback into a generated pgTAP file (deleted on exit)
      # and runs it against the DB reset above — the suite is transactional, so migrations are
      # still at HEAD here.
      - name: Contract quantities rollback harness
        run: scripts/test-contract-quantities-rollback.sh

      # AC-PLN-005 (issue #1720 S2): the feature-enforcement rollback must actually strip the
      # entitlement conjunct it appended to live policies, and re-applying must restore it. The
      # harness inlines migration 0534 and its rollback into a generated pgTAP file (deleted on exit).
      - name: Plans feature-enforcement rollback harness
        run: scripts/test-plans-feature-enforcement-rollback.sh

      # AC-PLN-012: reversing the allowance ledger removes only credits linked by the ledger, then
      # reapplying the migration restores the scheduled-grant objects.
      - name: Plans limit rollback harness
        run: scripts/test-plan-limits-rollback.sh

      # A push to `dev` is the full suite that backstops every PR's narrowed run; when it fails, say
      # which merge it ran on (a squash merge's subject ends in the PR number).
      - name: Name the merged change
        if: ${{ failure() && github.event_name == 'push' }}
        working-directory: .
        run: echo "::error title=Full suite failed after a push::$(git log -1 --format=%s)"

  browser-chromium:
    needs: [scope]
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.base_ref == 'main' && needs.scope.result == 'success' && needs.scope.outputs.release_light != 'true') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.1
      # Pull every Supabase image (stack, pg_prove) from Docker Hub: GHCR rate-limits
      # them (`toomanyrequests`, even authenticated) and public ECR hits its data limit.
      - name: Use Docker Hub for Supabase images
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"
      # Cache the Deno binary in the runner tool cache: setup-deno v2.0.5 checks it via
      # tc.find BEFORE downloading (src/install.ts), so a hit skips the release download
      # that 504'd on 2026-11-08/09. Bump the key together with the version below.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/hostedtoolcache/deno
          key: deno-${{ runner.os }}-${{ runner.arch }}-2.7.11
      # AC-S21-005 starts its local edge-function handler with `deno run`; each matrix runner is
      # isolated and cannot inherit the deno binary that the old unsharded integration job installed.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.7.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pmo-portal/package-lock.json
      - name: Install Node dependencies
        working-directory: pmo-portal
        run: npm ci
      - name: Start local Supabase stack
        run: supabase start -x studio,realtime,vector
      - name: Reset DB (migrations + seed)
        id: reset_db
        run: supabase db reset --yes
      # #1196: failure-only, bounded, redacted — see the pgtap job's comment for the rationale. A
      # reset failure here used to leave NO browser artifacts and no service-level evidence at all.
      - name: Diagnose reset failure (bounded, redacted)
        if: failure() && steps.reset_db.outcome == 'failure'
        continue-on-error: true
        run: node scripts/ci-reset-diagnostics.mjs --out /tmp/ci-reset-diagnostics.md
      - name: Upload reset diagnostics
        if: failure() && steps.reset_db.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reset-diagnostics-browser-chromium-${{ matrix.shard }}
          path: /tmp/ci-reset-diagnostics.md
          retention-days: 7
          if-no-files-found: ignore
      - name: Write .env.local for Vite / Playwright
        run: |
          eval "$(supabase status -o env)"
          echo "VITE_SUPABASE_URL=${API_URL}" > pmo-portal/.env.local
          echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}" >> pmo-portal/.env.local
          echo "VITE_FEATURES_USERVIEWS=true" >> pmo-portal/.env.local
          echo "VITE_FEATURES_AI_COMPOSER=true" >> pmo-portal/.env.local
          echo "VITE_FEATURES_AGENT_ASSISTANT=true" >> pmo-portal/.env.local
          echo "VITE_FEATURES_CRM=true" >> pmo-portal/.env.local
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
          } >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pmo-portal/package-lock.json') }}
      - name: Install Playwright
        working-directory: pmo-portal
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - name: Capture full Chromium inventory
        if: matrix.shard == 1
        continue-on-error: true
        working-directory: pmo-portal
        run: npx playwright test --project=chromium --list --reporter=json > /tmp/pw-chromium-full-list.json
      - name: Capture Chromium shard inventory (${{ matrix.shard }}/${{ strategy.job-total }})
        continue-on-error: true
        working-directory: pmo-portal
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }} --list --reporter=json > /tmp/pw-chromium-${{ matrix.shard }}-list.json
      - name: E2E tests (Playwright / Chromium shard ${{ matrix.shard }}/${{ strategy.job-total }})
        id: chromium
        working-directory: pmo-portal
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/pw-chromium-${{ matrix.shard }}.json npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=list,json
          outcome=$?
          printf '{"schemaVersion":1,"runId":"%s","attempt":"%s","revision":"%s","shard":%s,"processOutcome":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "${{ matrix.shard }}" \
            "$([ "$outcome" -eq 0 ] && echo success || echo failure)" > /tmp/browser-shard-${{ matrix.shard }}.json
          exit "$outcome"
      - name: Upload Chromium shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-chromium-${{ matrix.shard }}
          path: |
            /tmp/pw-chromium-${{ matrix.shard }}.json
            /tmp/pw-chromium-full-list.json
            /tmp/pw-chromium-${{ matrix.shard }}-list.json
            /tmp/browser-shard-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload Chromium shard Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-chromium-playwright-${{ matrix.shard }}
          path: |
            pmo-portal/playwright-report/
            /tmp/pmo-portal-test-results/
          retention-days: 1
          if-no-files-found: ignore

  integration-lanes:
    needs: [scope]
    if: ${{ always() && !cancelled() && ((github.event_name == 'pull_request' && github.base_ref == 'main' && needs.scope.result == 'success' && needs.scope.outputs.release_light != 'true') || github.event_name == 'workflow_dispatch') }}
    outputs:
      serial_e2e: ${{ steps.serial_e2e.outcome }}
      consent_e2e: ${{ steps.consent_e2e.outcome }}
      serve_adapter_dispatch: ${{ steps.serve_adapter_dispatch.outcome }}
    # The expensive job (Supabase stack + pgTAP + full Playwright e2e incl. visual-invariant
    # gate AC-VISUAL-ICON-001, ~6 min). Run it on PRs that TARGET main only — the authoritative
    # pre-merge gate. A squash-merge carries the PR-tested content; re-running on the main push
    # is redundant. PRs targeting dev get pgTAP only via the `pgtap` job above (fast lane — see
    # tiering comment below).
    # This work runs independently of the browser matrix; the `integration` aggregate below keeps
    # the branch-protection context and asserts these lane outcomes alongside browser evidence.
    # Also runnable on demand for any branch (Actions → CI → "Run workflow", or
    # `gh workflow run ci.yml --ref <branch>`), so a PR to `dev` can get its e2e proof on a
    # GitHub runner instead of the shared local stack. Trigger it once per PR, after local
    # fixes are done — not per fix round.
    # Trade-off: a dispatch runs branch code with the job's secrets without a PR audit trail;
    # only write-access collaborators can dispatch (fork PRs never receive secrets).
    runs-on: ubuntu-latest
    # 45, not 30: the three lanes alone reached ~25 min by v0.20 and the served-fn smoke was cut off at the cap
    timeout-minutes: 45
    defaults:
      run:
        # supabase CLI must be run from repo root (where supabase/config.toml lives)
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail fast on duplicate migration prefixes — the clear one-liner version of
      # the confusing `supabase db reset`/pgTAP failure a collision causes below.
      # Kept here (also in check:guards) because both fail this job's own later steps: a prefix
      # collision breaks db reset, a mis-tagged spec races the e2e lanes.
      - name: Migration prefix collision check
        run: bash scripts/check-migration-collisions.sh
      - name: E2E isolation-tag check
        working-directory: .
        run: bash scripts/check-e2e-isolation.sh
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.1
      # Pull every Supabase image (stack, pg_prove) from Docker Hub: GHCR rate-limits
      # them (`toomanyrequests`, even authenticated) and public ECR hits its data limit.
      - name: Use Docker Hub for Supabase images
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pmo-portal/package-lock.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/hostedtoolcache/deno
          key: deno-${{ runner.os }}-${{ runner.arch }}-2.7.11
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.7.11'

      - name: Install Node dependencies
        working-directory: pmo-portal
        run: npm ci

      # Docker is pre-installed on ubuntu-latest; storage + edge_runtime are disabled in
      # config.toml. Also exclude CI-unused containers to shave the stack-up time:
      # studio (web UI — headless CI), realtime (app has 0 realtime usage), vector (log
      # shipper). Kept: db/rest/auth/kong + storage (doc-upload e2e+pgTAP) + inbucket
      # (1 magic-link e2e, AC-AUTH-005).
      - name: Start local Supabase stack
        run: supabase start -x studio,realtime,vector

      # Applies every migration in order and re-seeds from supabase/seed.sql so tests
      # always start from a clean, known state.
      - name: Reset DB (migrations + seed)
        id: reset_db
        run: supabase db reset --yes

      # #1196 (the run that filed the issue): failure-only, bounded, redacted — see the pgtap job's
      # comment for the rationale. Ordered immediately after the reset so it runs before every later
      # step is skipped by the failure.
      - name: Diagnose reset failure (bounded, redacted)
        if: failure() && steps.reset_db.outcome == 'failure'
        continue-on-error: true
        run: node scripts/ci-reset-diagnostics.mjs --out /tmp/ci-reset-diagnostics.md
      - name: Upload reset diagnostics
        if: failure() && steps.reset_db.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reset-diagnostics-integration
          path: /tmp/ci-reset-diagnostics.md
          retention-days: 7
          if-no-files-found: ignore

      # pgTAP gate (0001..0060) — RLS, tenancy, SoD proofs. Skipped on a dispatch: the PR's
      # `pgtap` job already ran it (ci-e2e.sh sets run_pgtap when there is no PR).
      - name: pgTAP integration tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_pgtap
        run: supabase test db

      # AC-NS-004/005: the two-session SQL interleaving proof must gate the RELEASE path too, not only
      # the PR-to-dev `pgtap` job; a local-only harness would never gate a merge. It runs here against
      # the same reset database the pgTAP gate used, creates only its own synthetic org, and proves
      # that fixture is gone afterwards. Kept in the same skip condition as pgTAP so a re-dispatch
      # (whose PR already proved it) does not rerun it.
      - name: Financial statement nightly-intent race (local Supabase required)
        if: github.event_name != 'workflow_dispatch' || inputs.run_pgtap
        env:
          SUPABASE_DB_CONTAINER: supabase_db_pmo-portal
        run: node --test --test-concurrency=1 scripts/financial-statements-nightly-intent-race.test.mjs

      # Extract the anon key + API URL from the local stack and write them into the file
      # pmo-portal/src/lib/supabase/client.ts reads at build/dev time.
      - name: Write .env.local for Vite / Playwright
        run: |
          eval "$(supabase status -o env)"
          echo "VITE_SUPABASE_URL=${API_URL}" > pmo-portal/.env.local
          echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}" >> pmo-portal/.env.local
          # User-composed views (ADR-0036 I3–I5) are feature-flagged off by default; the
          # /views routes + "Compose with AI" affordance only render when these are 'true'.
          # The view e2e journeys (AC-VR-020, AC-VB-E01, AC-AS-022) need them ON in CI.
          echo "VITE_FEATURES_USERVIEWS=true" >> pmo-portal/.env.local
          echo "VITE_FEATURES_AI_COMPOSER=true" >> pmo-portal/.env.local
          # A2–A4 (ADR-0040): the in-app agent AssistantPanel (⌘J) is feature-flagged off by
          # default; the panel + its journeys only render when this is 'true'. The agent e2e
          # journeys (AC-AR-013, AC-AW-012, AC-CV-015) need it ON in CI.
          echo "VITE_FEATURES_AGENT_ASSISTANT=true" >> pmo-portal/.env.local
          # ops-admin (#243) added per-org feature-gating; `crm` (Sales Pipeline / Companies /
          # Contacts) env-defaults to OFF (features.ts FEATURE_ENV_DEFAULT.crm). The pre-existing
          # CRM e2e (AC-AUTH-003 nav, AC-SP-* pipeline, AC-INV-001) assert those surfaces, so the
          # CRM module must be ON in CI — restore the always-on-before behavior.
          echo "VITE_FEATURES_CRM=true" >> pmo-portal/.env.local
          # The ownership e2e (AC-VR-020) seeds two users via an admin client, reading these
          # from process.env (the local-stack service-role key is the well-known demo key —
          # ephemeral, not a production secret). Exported to GITHUB_ENV for the Playwright step.
          # The agent tenancy e2e (AC-AAN-036, AC-AGP-023) additionally build a second anon-key
          # client to prove "second user cannot see" — they read VITE_SUPABASE_ANON_KEY from
          # process.env, so it must be exported here too (not only written to .env.local for Vite).
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
          } >> "$GITHUB_ENV"

      # Cache the Chromium binary across runs (the download is ~15s). System deps (apt)
      # don't persist across runner VMs, so they always run; only the binary download is
      # saved on a cache hit. Keyed on the lockfile so a Playwright bump busts the cache.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pmo-portal/package-lock.json') }}
      # Install only Chromium: every project (chromium, serial, consent) in playwright.config.ts
      # runs devices['Desktop Chrome'], so one browser download covers all three. Browsers on a
      # cache miss, system deps always.
      - name: Install Playwright (browsers on cache miss; system deps always)
        working-directory: pmo-portal
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # playwright.config.ts's `webServer` is an ARRAY of two servers (#1968: PRODUCTION builds
      # served via `vite build` + `vite preview` — CI defaults to E2E_SERVER=build): the ordinary
      # one (:3000, analytics disabled) and a second, analytics-ENABLED one (:3100, the `consent`
      # project's lane, D6 in docs/plans/2026-07-25-observability-analytics.md — a server with a
      # real key was the only way to make AC-CON-003 non-vacuous; its env is baked in at build
      # time). Both are started for every project invocation below since `webServer` is a top-level
      # config, not per-project. reuseExistingServer=false in CI so Playwright owns the lifecycle
      # for both.
      # ERPNext P2: prove the served adapter-dispatch lane in CI (the money e2e itself is local-only —
      # it needs the Docker v15 bench + 1Password creds, which are a dev-bed concern, not CI's). The CI
      # gate is the non-ERPNext served-fn smoke (AC-ENA-001 boundary) through real Kong, proving the
      # serve/health-gate recipe holds on an ephemeral runner. Money semantics run locally + via unit tests.
      # Run early so a served-function failure reports before the long serial lane. The script
      # exports SUPABASE_FUNCTIONS_URL only to this child process and tears down its runtime; the
      # later consent/serial invocations do not inherit that URL, so their served-only specs remain
      # dependency-gated and never call the removed upstream.
      # Slice-0 fix-round finding 8: reuse the SAME trapped launch/health-gate/cleanup recipe as
      # local dev (scripts/serve-functions.sh) instead of inlining a second, untrapped copy here —
      # a bare `run:` block has no signal trap at all, so a step timeout/cancellation used to leak
      # the supabase-go/deno tree + the runtime container on this runner exactly like the local
      # bug finding 6 fixed. The secrets land in the SAME gitignored path the script already reads
      # locally (`supabase/functions/.env.local`) rather than an ad hoc /tmp file, so CI and local
      # dev exercise one code path. SUPABASE_FUNCTIONS_URL/SUPABASE_SERVICE_ROLE_KEY are already
      # exported (the script sets the former; "Write .env.local for Vite / Playwright" above set
      # the latter in $GITHUB_ENV) — served-fn-smoke.spec.ts now REQUIRES the latter (finding 7).
      - name: Serve adapter-dispatch (served-fn lane smoke)
        id: serve_adapter_dispatch
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_SECRETS: ${{ secrets.SUPABASE_SECRETS }}
        run: |
          printf '%s\n' "$SUPABASE_SECRETS" > supabase/functions/.env.local
          scripts/serve-functions.sh -- bash -c 'cd pmo-portal && npx playwright test served-fn-smoke --project=chromium'

      # serve-functions removes its temporary runtime, while Kong may still point at it; restart
      # the stack before later e2e lanes so they start from the ordinary functions-disabled state.
      - name: Restore ordinary local stack after served smoke
        if: ${{ always() && !cancelled() }}
        run: |
          supabase stop || true
          supabase start -x studio,realtime,vector

      - name: E2E tests (Playwright / consent)
        id: consent_e2e
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        working-directory: pmo-portal
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/pw-consent.json npx playwright test --project=consent --reporter=list,json

      # Preserve consent traces before the serial project clears /tmp/pmo-portal-test-results.
      - name: Upload consent Playwright diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-consent-test-results
          path: /tmp/pmo-portal-test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: E2E tests (Playwright / serial)
        id: serial_e2e
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        working-directory: pmo-portal
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/pw-serial.json npx playwright test --project=serial --workers=1 --reporter=list,json

      - name: Upload serial Playwright diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-serial-test-results
          path: /tmp/pmo-portal-test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload integration JSON reports for aggregate audits
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-e2e-reports
          path: |
            /tmp/pw-serial.json
            /tmp/pw-consent.json
          retention-days: 1
          if-no-files-found: warn

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: pmo-portal/playwright-report/
          retention-days: 7

      # playwright.config.ts redirects `outputDir` to `os.tmpdir()/pmo-portal-test-results` (see
      # its comment) so local `supabase functions serve`'s file watcher doesn't restart on writes
      # into the worktree — on this ubuntu-latest runner that resolves to /tmp/pmo-portal-test-results.
      # This is the per-test dir holding trace.zip + error-context.md for each FAILED spec; the html
      # report above only links to these, it doesn't always inline them. Upload both so
      # `npx playwright show-trace` can reconstruct the exact failing DOM/network first-time.
      - name: Upload Playwright test-results (traces)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: /tmp/pmo-portal-test-results/
          retention-days: 7

  # Heavy integration evidence is deliberately separate from the required check name: the required
  # `integration` aggregate below must run on light release PRs rather than being skipped.
  integration-full:
    needs: [scope, browser-chromium, integration-lanes]
    if: ${{ always() && !cancelled() && ((github.event_name == 'pull_request' && github.base_ref == 'main' && needs.scope.result == 'success' && needs.scope.outputs.release_light != 'true') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download Chromium shard 1 artifacts
        id: chromium_artifact_1
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-chromium-1
          path: /tmp/browser-shards/1
      - name: Download Chromium shard 2 artifacts
        id: chromium_artifact_2
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-chromium-2
          path: /tmp/browser-shards/2
      - name: Download Chromium shard 3 artifacts
        id: chromium_artifact_3
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-chromium-3
          path: /tmp/browser-shards/3
      - name: Download integration JSON reports
        id: integration_reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-e2e-reports
          path: /tmp/integration-reports

      - name: Verify Chromium shard provenance and completeness
        id: chromium_evidence
        if: ${{ always() }}
        continue-on-error: true
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = { runId: process.env.EXPECTED_RUN_ID, attempt: process.env.EXPECTED_ATTEMPT, revision: process.env.EXPECTED_REVISION };
          let failed = false;
          for (const shard of [1, 2, 3]) {
            try {
              const evidence = JSON.parse(readFileSync(`/tmp/browser-shards/${shard}/browser-shard-${shard}.json`, 'utf8'));
              if (evidence.schemaVersion !== 1 || evidence.runId !== expected.runId || evidence.attempt !== expected.attempt || evidence.revision !== expected.revision || evidence.shard !== shard || evidence.processOutcome !== 'success') throw new Error('evidence mismatch');
              if (!readFileSync(`/tmp/browser-shards/${shard}/pw-chromium-${shard}.json`, 'utf8').trim()) throw new Error('empty report');
            } catch {
              console.error(`browser shard ${shard}: missing, stale, or unsuccessful evidence`);
              failed = true;
            }
          }
          if (failed) process.exitCode = 1;
          NODE

      - name: Chromium inventory partition audit
        id: chromium_inventory
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          export PLAYWRIGHT_CONFIG_PROVENANCE="$(node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; const lock=JSON.parse(readFileSync("pmo-portal/package-lock.json","utf8")); console.log(JSON.stringify({sha256:createHash("sha256").update(readFileSync("pmo-portal/playwright.config.ts")).digest("hex"),lockedPlaywrightVersion:lock.packages["node_modules/@playwright/test"].version}))')"
          node scripts/check-browser-shard-inventory.mjs --full \
            /tmp/browser-shards/1/pw-chromium-full-list.json \
            /tmp/browser-shards/1/pw-chromium-1-list.json \
            /tmp/browser-shards/2/pw-chromium-2-list.json \
            /tmp/browser-shards/3/pw-chromium-3-list.json \
            /tmp/browser-shards/1/pw-chromium-1.json \
            /tmp/browser-shards/2/pw-chromium-2.json \
            /tmp/browser-shards/3/pw-chromium-3.json

      # A skipped test is not a passing one. The audit sees all five reports in one invocation,
      # after both producers finish, so allowlist entries remain lane-scoped and stale entries fail.
      - name: E2E skip audit — every skip is explained
        id: e2e_skip_audit
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: node scripts/check-e2e-skips.mjs /tmp/browser-shards/1/pw-chromium-1.json /tmp/browser-shards/2/pw-chromium-2.json /tmp/browser-shards/3/pw-chromium-3.json /tmp/integration-reports/pw-serial.json /tmp/integration-reports/pw-consent.json

      - name: E2E timing budget audit
        id: e2e_timing_audit
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: node scripts/check-e2e-time-budget.mjs --summary /tmp/pw-time-budget-summary.json /tmp/browser-shards/1/pw-chromium-1.json /tmp/browser-shards/2/pw-chromium-2.json /tmp/browser-shards/3/pw-chromium-3.json /tmp/integration-reports/pw-serial.json /tmp/integration-reports/pw-consent.json

      - name: Upload E2E timing summary
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-time-budget-summary
          path: /tmp/pw-time-budget-summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Required integration result requires all browser evidence and audits
        if: ${{ always() }}
        run: |
          test "${{ needs.browser-chromium.result }}" = success
          test "${{ needs.integration-lanes.result }}" = success
          test "${{ needs.integration-lanes.outputs.serial_e2e }}" = success
          test "${{ needs.integration-lanes.outputs.consent_e2e }}" = success
          test "${{ needs.integration-lanes.outputs.serve_adapter_dispatch }}" = success
          test "${{ steps.chromium_artifact_1.outcome }}" = success
          test "${{ steps.chromium_artifact_2.outcome }}" = success
          test "${{ steps.chromium_artifact_3.outcome }}" = success
          test "${{ steps.integration_reports.outcome }}" = success
          test "${{ steps.chromium_evidence.outcome }}" = success
          test "${{ steps.chromium_inventory.outcome }}" = success
          test "${{ steps.e2e_skip_audit.outcome }}" = success
          test "${{ steps.e2e_timing_audit.outcome }}" = success

  # REQUIRED CONTEXT: main protection requires exactly `verify` + `integration`. This aggregate
  # always reports for a main PR. The light lane proves scope validated every version source and
  # confirms the heavy jobs were skipped; the normal lane fails closed on all full evidence.
  integration:
    needs: [scope, browser-chromium, integration-lanes, integration-full]
    if: ${{ always() && !cancelled() && ((github.event_name == 'pull_request' && github.base_ref == 'main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release-please version check passed
        if: needs.scope.outputs.release_light == 'true'
        run: |
          test "${{ needs.scope.result }}" = success
          test "${{ needs.browser-chromium.result }}" = skipped
          test "${{ needs.integration-lanes.result }}" = skipped
          test "${{ needs.integration-full.result }}" = skipped
      - name: Full integration evidence passed
        if: needs.scope.outputs.release_light != 'true'
        run: |
          test "${{ needs.browser-chromium.result }}" = success
          test "${{ needs.integration-lanes.result }}" = success
          test "${{ needs.integration-full.result }}" = success
