name: Agent Surfaces

on:
  pull_request:
    paths:
      - '.claude/**'
      - '.codex/**'
      - '.github/workflows/agent-surfaces.yml'
      - '.gitignore'
      - 'docs/pi-delegation.md'
      - 'scripts/sync-agent-surfaces.mjs'
      - 'scripts/sync-agent-surfaces.test.mjs'
      - 'scripts/changed-lines-coverage.mjs'
      - 'scripts/changed-lines-coverage.test.mjs'
      - 'scripts/vendor-skills.sh'
  push:
    branches: [main]
    paths:
      - '.claude/**'
      - '.codex/**'
      - '.github/workflows/agent-surfaces.yml'
      - '.gitignore'
      - 'docs/pi-delegation.md'
      - 'scripts/sync-agent-surfaces.mjs'
      - 'scripts/sync-agent-surfaces.test.mjs'
      - 'scripts/changed-lines-coverage.mjs'
      - 'scripts/changed-lines-coverage.test.mjs'
      - 'scripts/vendor-skills.sh'
  workflow_dispatch: {}

# Least privilege, like every other workflow here. Without this block the job inherited the
# repo-wide default, which was `write` (public repo — a read-only token is all a checker needs).
permissions:
  contents: read

concurrency:
  group: agent-surfaces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Unit tests
        run: node --test scripts/sync-agent-surfaces.test.mjs scripts/changed-lines-coverage.test.mjs
      - name: Agent surface drift check
        run: node scripts/sync-agent-surfaces.mjs --check
      - name: Vendor script syntax
        run: bash -n scripts/vendor-skills.sh
