
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Security L1: caps the Referer header on outbound links (e.g. from the auth pages) so a
         recovery/invite token never leaks in the URL's query/hash to a third-party origin. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Inter variable webfont (ADR-0037): self-hosted (2026-07-28, IMPORTANT-7) — the
         @font-face rules + files live in index.css / public/fonts/, NOT a Google Fonts CDN
         link. Do not re-add a fonts.googleapis.com/fonts.gstatic.com <link> here: it makes an
         uncontrolled third-party request on every page load, including /privacy, before any
         consent choice and regardless of analytics opt-out (AC-CON-012). -->
    <title>PMO Portal</title>
    <!-- No-flash theme bootstrap (F2): apply the persisted / prefers-color-scheme
         theme BEFORE first paint so the canvas never flashes the wrong scheme.
         Synchronous + pre-module so it runs before <body> renders; the runtime
         useTheme hook keeps state in sync after hydration and CSS .dark does the rest. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored == null && prefersDark);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          else root.classList.remove('dark');
        } catch (e) {
          /* localStorage / matchMedia unavailable — default to light (no class). */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
